# Shipped defaults of the localization_toml module.
#
# This file is the module's own configuration layer: the kernel merges it as
# the lowest defaults layer (docs/configuration.md, "The layer stack"), so
# every assembly configuration - config/engine.toml or a staged override -
# wins over anything written here. Defaults FILL: a key a higher layer
# already provided is never touched.
#
# Documented in README.md next to this file.

[localization]
# Where the language files live, resolved against the executable directory.
# The engine ships no content: a mod ships its translations under assets/
# (the mod packaging copies assets/ wholesale) and points this key at them,
# e.g. directory = "mods/my_mod/assets/languages".
directory = "languages"
# The language activated at startup (the file stem: "en" loads en.toml).
language = "en"
# The language translate() falls back to when the active language is
# missing a key. A key missing from both degrades to the key itself,
# logged once.
fallback = "en"
