# Shipped defaults of the radiance_cascades module (the radiance cascades
# global illumination technique; both probe placements ship in this build and
# the run selects one by demanding screen_space_radiance_cascades or
# world_space_radiance_cascades).
#
# The module's own configuration layer: the kernel merges it as the lowest
# defaults layer, so config/engine.toml (and staged overrides) win over
# anything written here. Defaults FILL: a key a higher layer already
# provided is never touched.
#
# Documented in README.md next to this file.

[lighting.radiance_cascades]
# There is deliberately no placement key here: the probe placement is the
# run's DEMAND, not a tuning value - the mod demands
# screen_space_radiance_cascades (probes anchor on the visible frame's depth
# buffer; off-screen hits degrade to direct-only - the classic screen-space
# limitation) or world_space_radiance_cascades (probes anchor in a dense 3D
# world-space grid, camera-centered, cell size = world_cell_size * 2^cascade,
# that traces the SDF from each probe's world position so probes can sample
# off-screen geometry). Both placements ship in this build; the demanded
# capability selects which pass class the module constructs.
cascades = 5
interval_base = 0.5
interval_factor = 3.0
probe_stride = 8
# World-space placement: grid cell size (world units) for cascade 0. Each
# coarser cascade doubles the cell size (cellSize_c = world_cell_size * 2^c).
# Only applies when the run demanded world_space_radiance_cascades.
world_cell_size = 1.0
# World-space grid dimensions (cells per axis) for cascade 0. The dimensions
# stay constant per cascade (the coarser grid covers a 2x larger world
# extent at 2x the cell stride). Defaults: 8x8x4 - small enough that the
# 2D-array-image storage stays within Vulkan's maxImageArrayLayers (>= 256)
# for direction counts up to 256 (octahedron 16*16 = 256). Only applies when
# the run demanded world_space_radiance_cascades.
world_grid_w = 8
world_grid_h = 8
world_grid_d = 4
base_rays = 128
# Angular mapping of the field's directional domain:
#   "octahedron"          - octahedral map texel grid (default; ~base_rays
#                           directions, each with its exact solid angle)
#   "cubemap"             - six cube face grids (~base_rays directions)
#   "spherical_harmonic"  - the gather projects the field onto the real
#                           spherical harmonics through band 2 and evaluates
#                           the irradiance analytically: band-limited, softly
#                           smoothed GI at the same march cost
mapping = "octahedron"
# Light transport bounces per frame: 1 = direct lighting only inside the GI;
# every extra bounce re-runs the cascade sequence and relights the march's
# hit points with the previous bounce's gathered transport (cost linear in
# bounces).
bounces = 1
gather_visibility = true
los_steps = 16
march_steps = 48
relight_shadows = true
shadow_steps = 24
# Edge-aware spatial filter radius on the gathered GI (pixels, 0 = off).
# Removes the probe grid's spatial scale; depth/normal weights keep edges hard.
# One probe cell spans 8 pixels (screen-space stride 8), so the radius must
# average ACROSS cells. The filter operates on the gather output image which
# is screen-space regardless of placement, so the radius applies to both.
spatial_filter = 10
