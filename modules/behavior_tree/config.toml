# Shipped defaults of the behavior_tree module.
#
# This file is the module's own configuration layer: the kernel merges it as
# the lowest defaults layer (docs/configuration.md, "The layer stack"), so
# every assembly configuration - config/engine.toml or a staged override -
# wins over anything written here. Defaults FILL: a key a higher layer
# already provided is never touched.
#
# Documented in README.md next to this file.

[behavior_tree]
# Whether newly created trees join the module's frame tick by default (the
# kernel's EngineFrameEvent loop heartbeat, the tick every gameplay module
# uses). true is
# the AI story: create a tree, it runs. A tree a consumer drives itself
# (cutscenes stepping on their own clock, tests) opts out per tree through
# the capability's setAutoTick - or the assembly turns the default off here
# for fully manual ownership.
auto_tick = true
