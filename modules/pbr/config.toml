# Shipped defaults of the pbr module (the direct lighting technique).
#
# The module's own configuration layer: the kernel merges it as the lowest
# defaults layer, so config/engine.toml (and staged overrides) win over
# anything written here. Defaults FILL: a key a higher layer already
# provided is never touched.
#
# Documented in README.md next to this file.

# The shared specular hand-off point: below the threshold the analytic
# specular draws the sun, above it the reflection ray does. Both the direct
# pass and the ray-traced reflection pass read this key, so the two sides of
# the hand-off can never drift apart.
[lighting]
max_roughness = 0.5

[lighting.pbr]
shadows = true
penumbra = 12.0
shadow_steps = 24
