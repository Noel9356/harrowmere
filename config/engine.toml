# engine runtime configuration - the ASSEMBLY layer.
#
# Paths are resolved relative to the engine executable directory.
#
# This file is the highest file-backed configuration layer, and it owns
# exactly what an assembly owns: the runtime layout, the provider wiring and
# the permission policy. It deliberately holds NO module settings: the
# modules that carry tunables ship their own defaults in modules/<name>/config.toml
# (copied to runtime/config/modules/<name>/config.toml by the build; a module
# without one runs on its code defaults), and every content
# package ships its own in mods/<id>/config.toml. Those defaults FILL every
# key this file leaves unset - anything written HERE wins over them, which
# is the whole override story: to tune a module for this assembly, add its
# section here; to change what a module does everywhere, edit the module's
# own config.toml. The precedence rules and the provenance report are
# documented in docs/configuration.md.
#
# The world content lives with the content mod: mods/test_scene declares
# scene.toml in its manifest, and this file deliberately defines no [scene]
# section - the demo room, camera and sun come from that package. An assembly
# that wants its own world defines [scene] here (it then wins over every
# installed content mod).

[engine]
# Modules are NOT listed here and there is no demand list either: the active
# mods are the sole demand source. A module loads only when an active mod's
# manifest requires a capability it provides, and the providers' own
# requirements pull their dependencies transitively (the renderer, for
# example, brings window and logging with it). A capability no mod requires
# stays dormant: its plugin is never instantiated. This assembly's demo
# pipeline is demanded by the shipped content mod (mods/test_scene): camera
# input, frame rendering, the scene light state, the direct PBR pass, the
# radiance cascades GI, the physics step and key-triggered captures.

# Mod packages are discovered on disk, not listed here: EVERY subdirectory of
# mod_directory is a mod package of the application (one without a mod.toml is
# reported as a broken install and skipped). The content package
# (mods/test_scene) arrives with the runtime.
# mod_directory = "mods"
# Additional scan roots, scanned after mod_directory in the listed order - an
# assembly composes its mod set from several install locations (an engine
# package directory plus a user directory) without copying packages into one
# tree. A package id that appears in more than one scanned root is reported
# with both locations and the later package dropped. Command line --mods-dir
# flags (repeatable) replace BOTH keys together.
# extra_mod_directories = []

# Hot reload (development loop): add "hot_reload" to a mod's required
# capabilities and the watcher joins the run - shader, script and config
# changes surface as events while the engine is running. Demand-driven like
# every module: a run whose mods do not demand it never pays for it.
# [hot_reload]
# watch_interval_ms = 250
# watch_paths = ["runtime/shaders", "mods", "config"]   # custom roots, engine-relative

# CPU-side frame pacing (read by the composition root after the layers
# merge): max_fps caps the frame rate on top of the swapchain's vsync
# (0 = uncapped, the default - an unconfigured run never reads an extra
# clock); idle_poll_ms paces the renderer-less event pump. Both re-read on
# every live configuration reload (see below).
# max_fps = 60
# idle_poll_ms = 16

# The frame clock (docs/architecture.md, "The frame clock"): the composition
# root publishes one EngineFrameEvent heartbeat per loop iteration - the tick
# every simulation module follows (timers, physics, behavior trees, tweens,
# the net pump, script frame handlers) - so a headless run (no renderer)
# ticks exactly like a rendered one. fixed_update_hz adds the opt-in
# fixed-timestep lane (EngineFixedUpdateEvent, the constant-step delta a
# deterministic sim advances by; 0 = disabled, the default), with
# max_fixed_update_steps clamping one iteration's catch-up burst.
# fixed_update_hz = 60
# max_fixed_update_steps = 5

# Finite runs (the headless and CI shape): quit_after_seconds ends the loop
# after the given wall-clock time through the clean-shutdown path (exit 0) -
# a smoke run that needs no window and no kill signal. 0 = run until the
# window closes (the default).
# quit_after_seconds = 10.0

# Live configuration reload (opt-in, default off - the frame path pays
# nothing unless a run asks for it): with a positive interval the frame loop
# stats this file at that rate; a changed mtime re-assembles every layer,
# diffs the effective values and publishes ConfigurationReloadedEvent with
# the changed key paths. The shipped subscribers re-read their own keys
# (renderer exposure/tonemap/bloom weights, screenshot capture output, audio
# master volume, logging level/flush, these pacing keys); world content
# ([scene]) changes are reported as restart-required. A reload never re-runs
# mod discovery.
# config_reload_poll_seconds = 0.5

# Mod ids listed here are skipped during discovery; useful to keep a package
# installed but inactive without deleting it. Disabling the content mod also
# removes its world: the run then renders an empty scene unless the assembly
# defines [scene] itself.
# disabled_mods = ["test_scene"]

# Provider selection for capabilities that several implementations offer.
# The key is the capability name (a family such as "renderer" when the
# candidates are its implementation-bound members), the value is the
# component name that should win. Only needed when more than one
# implementation is present in the build.
[providers]
# physics = "physics_builtin"

# Permission denials. Each entry denies one declared permission of one
# component (module, native mod or script mod); denied permissions fail
# startup with a precise diagnostic.
[permissions]
# denied = [["example_cpp_mod", "capability.input"]]

# Trust decisions over the risk advisories (docs/architecture.md, "Risk
# advisories and the trust gate"). The kernel risk-assesses every active mod
# AND every active module before any of their code is used: the structural
# signals are native machine code (mods), permissions outside the
# capability.* namespace (filesystem.write and friends) and a broad
# capability acquisition surface. Flagged components are always ANNOUNCED as
# warnings; using them additionally requires one of:
#
#   - a standing trust decision here (this section), or
#   - the user's agreement at startup (an interactive run asks once per
#     launch; a headless run cannot ask, so it fails with these
#     instructions).
#
# trustMods / trustModules name trusted component ids; trustAllMods /
# trustAllModules flip the gate for every component of one kind. The shipped
# demo trusts its own content package and the shipped modules the demo
# pipeline activates that carry an advisory (screenshot saves captures,
# persistence loads and saves, asset imports glTF files, ui acquires the
# overlay's capability set) - a fresh assembly with third-party mods trusts
# nothing and is asked.
#
# The section is assembly-owned: a mod's shipped config.toml cannot define
# [trust] (a package that could trust itself would defeat the gate), and a
# staged override (--set trust.trustAllMods=true) works like any key.
[trust]
trustMods = ["test_scene"]
trustModules = ["screenshot", "persistence", "asset", "ui"]
# trustAllMods = false
# trustAllModules = false

# Diagnostics are opt-in: the shutdown communication latency and frame-time
# report is a developer tool. Enable it here.
[diagnostics]
latency_report = false

# ---------------------------------------------------------------------------
# Module overrides (all optional - every module runs on its own shipped
# defaults without a single line here). A section written below replaces the
# module defaults key by key, never wholesale: tables deep-merge, so a
# one-key override leaves the module's other defaults standing.
#
# Where each module's settings live:
#
#   [logging]                     modules/logging_stdout/config.toml
#   [window]                      modules/window_glfw/config.toml
#   [input] / [input.actions]     modules/input_glfw/config.toml (+ the
#                                 content mod's config.toml for its bindings)
#   [renderer]                    modules/renderer_vulkan/config.toml
#   [lighting] (max_roughness)    modules/pbr/config.toml
#   [lighting.pbr]                modules/pbr/config.toml
#   [lighting.radiance_cascades]  modules/radiance_cascades/config.toml
#   [physics]                     modules/physics_builtin/config.toml
#   [bvh]                         modules/bvh/config.toml
#   [screenshot]                  modules/screenshot_png/config.toml
#
# The modules below carry no defaults file: their settings run on code
# defaults, and the section can still be added here to tune them.
#
#   [audio]                       modules/audio_miniaudio (code defaults;
#                                 documented in the module README)
#   [ui]                          modules/ui_imgui (code defaults)
#   [hot_reload]                  modules/hot_reload_watcher (code defaults)
#   [profiler]                    modules/profiler (code defaults)
#   [scripting]                   modules/lua_scripting (code defaults)
#
# Examples - uncomment to override:
#
# [renderer]
# exposure = 1.4
#
# [lighting.radiance_cascades]
# world_cell_size = 1.0    # (world-space placement only) cascade 0 cell size in world units
# world_grid_w = 8         # (world-space placement only) cascade 0 grid width in cells
# world_grid_h = 8         # (world-space placement only) cascade 0 grid height in cells
# world_grid_d = 4         # (world-space placement only) cascade 0 grid depth in cells
# mapping = "cubemap"        # octahedron (default) | cubemap | spherical_harmonic
# bounces = 2                # GI bounce count (default 1)
# (The probe placement is not a config key: the run selects it by demanding
# screen_space_radiance_cascades or world_space_radiance_cascades in the mod.)
#
# [bvh]
# split = "sah"              # midpoint (default) | median | sah
# traversal_cost = 1.0       # the SAH cost model's node-visit weight (sah only)
#
# [input.actions]
# boost = "RightShift, gamepad:A"
# Semantic camera actions the fly controller consumes when defined
# (camera_forward / camera_back / camera_left / camera_right / camera_up /
# camera_down; "boost" and "release_cursor" are already wired). Absent keys
# keep the fixed WASD bindings.
# camera_forward = "W, gamepad:LeftY"
