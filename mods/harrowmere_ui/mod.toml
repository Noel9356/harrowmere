# harrowmere_ui - the game's UI surface mod (the manifest wiring is the
# foundation this mod's tasks build on: 0.1 validated it, 7.3P1 draws through
# the renderer's overlay seam, 7.4P1 drives the input layer). Consumes the sim
# capability through the family name `harrowmere` - mod-to-mod consumption is
# legal (docs/architecture.md, "Capability directions") - and owns the
# renderer's overlay seam (D-UI-1): the engine's ui_imgui module is
# trim-deleted and must never come back (the boot test asserts its absence).
id = "harrowmere_ui"
version = "0.1.0"
engine_api = 1
type = "native"
entry = "harrowmere_ui"                # library base name; LIBRARY_OUTPUT_DIRECTORY lands it in this package dir
display_name = "Harrowmere UI (ImGui surface)"
description = "Harrowmere's UI surface: debug overlay (Phase 1), HUD/panels (Phase 2). Draws through the renderer's overlay seam, drives the input layer (7.4P1), and reads the world through harrowmere.core views only."
capabilities = ["harrowmere", "input", "renderer.vulkan.overlay"]
provides = ["ui.harrowmere"]           # the UI mod's own capability; the panels arrive at 7.3P1
# renderer: the 7.4P1 camera rig seam (the input mapper applies look through
# the renderer capability's camera pose). OPTIONAL by contract - the feature
# degrades to tracked-heading-only when the provider is absent, never the run
# (common.md section 4.0); in the game assembly this mod's own
# renderer.vulkan.overlay requirement pulls the renderer module, so the probe
# resolves in every real run.
optional_capabilities = ["renderer"]
config_keys = []
requires = []
