# harrowmere_core - the game's authoritative simulation and ALL base content.
#
# This manifest is the demand root of the whole run: everything under
# `capabilities` pulls its provider into the assembly (transitively), and
# `provides` publishes the game's own capability family to every other
# component. The compiled manifest in the plugin binary must agree with this
# file on identity and on `provides` - the kernel verifies both at startup.
id = "harrowmere_core"
version = "0.1.0"
engine_api = 1
type = "native"
entry = "harrowmere_core"              # library base name; LIBRARY_OUTPUT_DIRECTORY lands it in this package dir
display_name = "Game Core (authoritative simulation)"
description = "Harrowmere's authoritative simulation: world model, characters, justice, economy, events. Owns all base game content (data/, scene.toml) and the harrowmere.core capability surface."
# lighting + pbr_direct_diffuse: the 7.2P1 sun seam. These are REQUIRED, not
# optional, on purpose: the kernel's demand closure is seeded by required
# capabilities alone and optional ones deliberately stay out of it
# (engine_kernel.cpp, computeDemandClosure) - an optional-only lighting seam
# can therefore never pull the provider, the probe in construct() would find
# nothing in EVERY run, and the world renders unlit (black ground under a
# blue sky - found on the first Windows run, 2026-10-30). Demanding the
# family (lighting) brings the state in; demanding the technique's marker
# (pbr_direct_diffuse) attaches the analytic direct pass - a lighting-family
# demand alone leaves the pass idle. The mod code keeps its degrade-if-absent
# guards (the probe, the sink's null checks) so a build without the provider
# still runs the sim; the RUN, not the code, pins the visual contract.
#
# gi_screen_world_diffuse (rev 30; renamed gi_traced_diffuse -> gi_sdf_hemisphere_diffuse
# in rev 31 - the owner rejected the generic name - and -> gi_screen_world_diffuse in
# rev 33: since rev 32 every gather ray resolves in TWO spaces, so the rev-31 name
# described only the world-stage fallback): the per-pixel two-space diffuse GI
# gather (screen-space depth march first, exact analytic SDF second - Lumen's
# trace ordering over the exact field). Demanded like the direct pass's marker so
# the indirect radiance target exists and the composite stops carrying the full
# analytic ambient (it drops to a quarter share when the GI term is present - see
# scene_composite.frag).
capabilities = ["logging", "scene", "input", "lighting", "pbr_direct_diffuse", "gi_screen_world_diffuse", "character_customisation", "screenshot"]
# character_customisation (rev 34): the modular-character service - the
# parts library, the compatibility-rule registry, the validated attachment-
# tree assemblies (the owner's architecture document, first implementation
# test). Demanded like the lighting markers: the kernel's required-capability
# closure pins the provider, the mod acquires the pointer and installs its
# parsed parts library at start.
provides = ["harrowmere.core"]         # native mods PROVIDE through mod.toml; the compiled manifest must agree
optional_capabilities = ["physics", "audio", "animation", "asset"]  # degrade-if-absent is the contract (§4.0)
permissions = ["filesystem.write"]     # saves (task 7.1) write into the user's save directory
config_keys = ["harrowmere.tick_rate", "harrowmere.time_scale", "harrowmere.autosave_game_hours", "harrowmere.seed", "harrowmere.time_of_day_game_hours", "harrowmere.weather_kind", "harrowmere.capture_scenario"]
requires = []
scene = "scene.toml"                   # harrowmere_core claims the world - the only claimant in the runtime (one-world rule)
