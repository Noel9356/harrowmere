# Harrowmere's world claim - the run's initial backdrop (D-PRES-1).
#
# The game owns NO world art in v1: this file is a ground plane, a flat sky
# and a sun, sized to the pinned v1 world patch (region grid 16x16 at 1024 m
# per region, A-40 - the plane spans the whole grid). The static [scene] world
# is the INITIAL state; the living world is the simulation's own state, shown
# through the scene bridge (task 7.2) driving the scene capability at runtime.
# This package is the run's only scene claimant (the one-world rule).
[scene]
# The runtime marker budget: 65 territories (1 empire + 4 kingdoms + 12
# cities + 48 villages) + 4 safe-zone discs + the static backdrop objects -
# the module default (32) cannot hold the 7.2P1 markers, so the world claim
# raises it (scene.max_objects is the scene module's declared key; hard
# ceiling 256).
max_objects = 128
sky_radiance = [0.20, 0.27, 0.38]

[scene.camera]
# The default far plane is the engine's 500 m demo-room default; this world
# is 16 km across (A-40) with territory markers one region (1024 m) apart, so
# 500 m clipped EVERY marker out of the depth range - the ground plane turned
# into a 500 m brown disc inside a black void (the first Windows session's
# "blue and brown with black flashes"). The far plane reaches past the plane's
# edge so the ground runs to the horizon and neighbouring markers stay inside
# the depth range. near stays the engine default (0.1).
position = [24.0, 6.0, 24.0]
look_at = [0.0, 1.0, 0.0]
far = 20000.0

[scene.sun]
direction = [-0.4, -0.8, -0.3]
color = [1.0, 0.96, 0.88]
intensity = 3.0

# The worked land around the still water: one plane, no art.
[[scene.objects]]
type = "plane"
position = [0.0, 0.0, 0.0]
size = [8192.0, 0.01, 8192.0]
albedo = [0.34, 0.30, 0.22]
